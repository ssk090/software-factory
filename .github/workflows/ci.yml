# Every push and PR: lint, typecheck, and the factory's tests with no network (fake tracker and git
# host, pi-ai's faux model playing the agents). The docker job builds the image and runs a whole
# pipeline in the docker sandbox.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: durable/package-lock.json
      - name: shellcheck
        run: shellcheck -S warning docker-entrypoint.sh durable/bin/ff
      - name: git identity for the scratch repos
        run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - name: install
        working-directory: durable
        run: npm ci
      - name: typecheck
        working-directory: durable
        run: npm run check
      - name: "tests (the docker sandbox tests run too: the runner has Docker)"
        working-directory: durable
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: build the image
        run: docker build -t software-factory .
      - name: the image runs the factory
        run: docker run --rm --entrypoint /factory/durable/bin/ff software-factory help
      - name: git identity for the scratch repos
        run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - name: a whole pipeline in the docker sandbox
        working-directory: durable
        env:
          SF_DOCKER_PIPELINE: "1"
          SANDBOX_TEST_IMAGE: software-factory
        run: npm ci && node --disable-warning=ExperimentalWarning --test --test-concurrency=1 test/docker.test.ts
