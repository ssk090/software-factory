id = "local.factory"
name = "software-factory"
version = "0.1.0"
description = "Live flow graph of the software factory, with a ticket input box."
platforms = ["macos", "linux"]
min_herdr_version = "0.8.2"

[[panes]]
id = "view"
title = "factory"
placement = "overlay"
command = ["python3", "../../factory-view.py"]

[[actions]]
id = "open"
title = "factory: live workflow"
description = "Open the software factory live graph and ticket input."
contexts = ["pane", "workspace"]
command = ["bash", "open.sh"]
