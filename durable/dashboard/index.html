<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software factory</title>
<link rel="icon" href="data:,">
<style>
  /* Tokens: shadcn/ui neutral theme (oklch) plus status and sidebar tokens. See DESIGN.md. */
  :root {
    --radius: 0.625rem;
    --radius-sm: calc(var(--radius) - 4px); --radius-md: calc(var(--radius) - 2px); --radius-lg: var(--radius); --radius-xl: calc(var(--radius) + 4px);
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0); --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
    --success: oklch(0.527 0.154 150.069); --warning: oklch(0.555 0.163 48.998); --info: oklch(0.488 0.243 264.376);
    --sidebar: oklch(0.985 0 0); --sidebar-foreground: oklch(0.145 0 0); --sidebar-accent: oklch(0.97 0 0); --sidebar-border: oklch(0.922 0 0);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0); --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%); --ring: oklch(0.556 0 0);
      --success: oklch(0.723 0.219 149.579); --warning: oklch(0.769 0.188 70.08); --info: oklch(0.623 0.214 259.815);
      --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --sidebar-accent: oklch(0.269 0 0); --sidebar-border: oklch(1 0 0 / 10%);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 15px; } h3 { font-size: 13px; margin: 16px 0 8px; }
  .muted { color: var(--muted-foreground); }
  a { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--muted-foreground); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--foreground); }
  .error { color: var(--destructive); }
  .grow { flex: 1; }
  #detail .bar > input[type=text] { flex: 1; width: auto; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  /* Layout: shadcn sidebar block (sidebar-07) with an inset content area */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 0.2s ease; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); }
  .sidebar-head { display: flex; align-items: center; gap: 8px; padding: 4px 0 16px 8px; }
  .brand { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; font-weight: 600; white-space: nowrap; }
  .icon-btn { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; cursor: pointer; }
  .icon-btn:hover { background: var(--sidebar-accent); }
  .ic { flex: none; width: 16px; height: 16px; }
  .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-foreground); font-size: 12px; font-weight: 600; }
  .nav-label { padding: 12px 8px 4px; font-size: 12px; color: var(--muted-foreground); }
  nav#tabs { display: flex; flex-direction: column; gap: 2px; }
  nav#tabs button { white-space: nowrap; display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  nav#tabs button:hover { background: var(--sidebar-accent); }
  nav#tabs button.on { background: var(--sidebar-accent); font-weight: 500; }
  nav#tabs button .label { flex: 1; }
  nav#tabs button .count { font-size: 12px; font-variant-numeric: tabular-nums; }
  .sidebar-foot { margin-top: auto; padding: 8px; font-size: 12px; }
  .page { min-width: 0; padding: 24px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
  main.open { grid-template-columns: minmax(0, 1fr) minmax(380px, 42%); gap: 16px; }
  main > div { min-width: 0; }

  /* Cards: shadcn Card; stat cards are the SectionCards pattern */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .stat, section.card, aside { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); min-width: 0; }
  .stat { padding: 16px; }
  .stat .label { font-size: 13px; color: var(--muted-foreground); }
  .stat .value { margin-top: 4px; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  section.card, aside { padding: 16px; }
  section.card { overflow-x: auto; }
  aside { display: none; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; }
  main.open aside { display: block; }

  /* Table: shadcn Table */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { height: 36px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
  td { font-size: 14px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }
  tr.click { cursor: pointer; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.nowrap { white-space: nowrap; }
  td.row-end { width: 1%; padding-top: 4px; padding-bottom: 4px; text-align: right; white-space: nowrap; }
  button.act.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  /* A row's remove icon (Button variant="ghost" size="icon"): the first click arms it, the second removes */
  .row-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); cursor: pointer; transition: background-color 0.15s, color 0.15s, border-color 0.15s, width 0.15s; }
  .row-icon:hover { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
  .row-icon:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .row-icon.armed { width: auto; gap: 4px; padding: 0 8px; grid-auto-flow: column; border-color: color-mix(in oklch, var(--destructive) 45%, transparent); background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); font-size: 12px; font-weight: 500; }
  .row-icon:disabled { opacity: 0.5; pointer-events: none; }
  tr.leaving { opacity: 0; transform: translateX(8px); transition: opacity 0.18s, transform 0.18s; }
  .score { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Button: shadcn Button (outline by default, primary for the main action) */
  button.act { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); color: var(--foreground); font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); transition: background-color 0.15s, color 0.15s; }
  button.act:hover { background: var(--accent); color: var(--accent-foreground); }
  button.act.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  button.act.primary:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  button.act:disabled { opacity: 0.5; pointer-events: none; }

  /* Input, Select, Textarea */
  input[type=text], select, textarea { font: inherit; color: var(--foreground); background: var(--background); border: 1px solid var(--input); border-radius: var(--radius-md); height: 36px; padding: 0 12px; min-width: 0; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
  input[type=text] { width: 100%; }
  textarea { width: 100%; height: auto; padding: 8px 12px; }
  input::placeholder, textarea::placeholder { color: var(--muted-foreground); }
  input[type=text]:focus-visible, select:focus-visible, textarea:focus-visible, button.act:focus-visible, nav#tabs button:focus-visible, .icon-btn:focus-visible, summary:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }

  /* Badge: shadcn Badge, tinted for status */
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--foreground); }
  .chip.ok { color: var(--success); border-color: color-mix(in oklch, var(--success) 40%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); }
  .chip.warn { color: var(--warning); border-color: color-mix(in oklch, var(--warning) 40%, transparent); background: color-mix(in oklch, var(--warning) 10%, transparent); }
  .chip.bad { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); }
  .chip.run { color: var(--info); border-color: color-mix(in oklch, var(--info) 40%, transparent); background: color-mix(in oklch, var(--info) 10%, transparent); }

  /* Empty and Alert */
  td.empty { padding: 32px 8px; text-align: center; color: var(--muted-foreground); }
  .card > .error, aside > .error { margin-bottom: 12px; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, transparent); border-radius: var(--radius-md); background: color-mix(in oklch, var(--destructive) 10%, transparent); }

  /* Code and the live feed: shadcn muted surface */
  pre, .live { margin: 0; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-md); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .live { max-height: 420px; overflow: auto; padding: 8px; }
  .live .tool { color: var(--info); } .live .user, .live .out { color: var(--muted-foreground); }
  .live .out { white-space: pre-wrap; }
  .live .error { color: var(--destructive); }
  details { border-top: 1px solid var(--border); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 500; border-radius: var(--radius-sm); }

  /* Collapsed sidebar: an icon rail (wide screens only) */
  @media (min-width: 761px) {
    .shell.collapsed { grid-template-columns: 56px minmax(0, 1fr); }
    .shell.collapsed .sidebar { align-items: center; padding: 16px 8px; }
    .shell.collapsed .sidebar-head { flex-direction: column; padding: 4px 0 16px; }
    .shell.collapsed .brand { flex: none; }
    .shell.collapsed .brand-name, .shell.collapsed .nav-label, .shell.collapsed nav#tabs .label, .shell.collapsed .count, .shell.collapsed .sidebar-foot { display: none; }
    .shell.collapsed nav#tabs { width: 100%; }
    .shell.collapsed nav#tabs button { justify-content: center; padding: 8px; }
  }

  /* Toasts: shadcn Sonner */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(356px, calc(100vw - 32px)); pointer-events: none; }
  .toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 4px 12px rgb(0 0 0 / 0.1); font-size: 13px; cursor: pointer; pointer-events: auto; animation: toast-in 0.2s ease-out; }
  .toast .ic { margin-top: 2px; }
  .toast.success .ic { color: var(--success); }
  .toast.error { border-color: color-mix(in oklch, var(--destructive) 40%, var(--border)); }
  .toast.error .ic { color: var(--destructive); }
  .toast.out { opacity: 0; transform: translateY(8px); transition: opacity 0.15s, transform 0.15s; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  /* Spend meter (sidebar foot) and the budget banner (Alert) */
  .meter { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .meter-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .meter-head strong { font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter-track { height: 6px; border-radius: 999px; background: var(--sidebar-accent); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: inherit; background: var(--primary); transition: width 0.4s ease, background-color 0.2s; }
  .meter-fill.warn { background: var(--warning); } .meter-fill.bad { background: var(--destructive); }
  .meter-note { font-size: 12px; color: var(--warning); }
  .banner { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); border-radius: var(--radius-lg); background: color-mix(in oklch, var(--warning) 10%, transparent); font-size: 13px; }
  .banner .ic { margin-top: 2px; color: var(--warning); }
  .stat .sub { margin-top: 2px; font-size: 12px; color: var(--muted-foreground); }

  /* Ticket detail: controls, Tabs (segmented), the timeline, the log */
  .notice { margin-bottom: 12px; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); border-radius: var(--radius-md); background: color-mix(in oklch, var(--warning) 10%, transparent); font-size: 13px; }
  .summary { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; gap: 2px; margin: 12px 0; padding: 3px; border-radius: var(--radius-lg); background: var(--muted); }
  .seg button { padding: 4px 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); font: inherit; font-size: 13px; cursor: pointer; transition: background-color 0.15s, color 0.15s, box-shadow 0.15s; }
  .seg button.on { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  .seg button:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .seg .n { margin-left: 4px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .chip.sm { height: 18px; padding: 0 6px; font-size: 11px; }
  .tl { position: relative; margin: 0; padding: 0; list-style: none; }
  .tl-item { position: relative; padding: 0 0 14px 24px; }
  .tl-item::before { content: ""; position: absolute; top: 18px; bottom: 0; left: 7px; width: 1px; background: var(--border); }
  .tl-item:last-child::before { display: none; }
  .tl-dot { position: absolute; top: 5px; left: 2px; width: 11px; height: 11px; border: 2px solid var(--border); border-radius: 50%; background: var(--card); transition: background-color 0.2s, border-color 0.2s; }
  .tl-item.done .tl-dot { border-color: var(--success); background: var(--success); }
  .tl-item.current .tl-dot { border-color: var(--info); background: var(--info); animation: pulse 2s ease-out infinite; }
  .tl-item.paused .tl-dot, .tl-item.waiting .tl-dot { border-color: var(--warning); background: var(--warning); }
  .tl-item.failed .tl-dot { border-color: var(--destructive); background: var(--destructive); }
  .tl-item.stopped .tl-dot { border-color: var(--muted-foreground); }
  .tl-item.next { opacity: 0.55; }
  .tl-item.next .tl-dot { border-style: dashed; }
  .tl-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tl-title { font-weight: 500; }
  .tl-time { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-steps { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .tl-step { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
  .tl-step:hover { background: color-mix(in oklch, var(--muted) 60%, transparent); }
  .tl-step.watching { border-color: var(--ring); }
  .tl-step:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .tl-step .name { white-space: nowrap; }
  .tl-step .model { min-width: 0; overflow: hidden; color: var(--muted-foreground); text-overflow: ellipsis; white-space: nowrap; }
  .tl-step .meta { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-note { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
  .tl-note.warn { color: var(--warning); } .tl-note.error { color: var(--destructive); }
  /* Documents: cards in the approval box, and the reader (shadcn Dialog) with rendered Markdown */
  .approve { margin-bottom: 4px; }
  .approve p { margin: 0 0 10px; font-size: 13px; }
  .doc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .doc-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color 0.15s, background-color 0.15s, transform 0.15s; }
  .doc-card:hover { border-color: var(--ring); background: color-mix(in oklch, var(--muted) 50%, transparent); }
  .doc-card:active { transform: scale(0.99); }
  .doc-card:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .doc-card .ic { width: 20px; height: 20px; color: var(--muted-foreground); }
  .doc-card .doc-name { font-weight: 500; }
  .doc-card .doc-meta { font-size: 12px; color: var(--muted-foreground); }
  .doc-card .go { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
  .file-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .file-row:last-child { border-bottom: 0; }
  .file-row .doc-meta { font-size: 12px; color: var(--muted-foreground); }
  dialog.doc { display: none; flex-direction: column; width: min(880px, calc(100vw - 48px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); color: var(--card-foreground); box-shadow: 0 16px 48px -12px rgb(0 0 0 / 0.4); }
  dialog.doc[open] { display: flex; animation: dialog-in 0.18s ease-out; }
  dialog.doc::backdrop { background: rgb(0 0 0 / 0.5); backdrop-filter: blur(2px); }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(6px) scale(0.985); } }
  .doc-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .doc-head .seg { margin: 0; }
  .doc-head h2 { margin-right: 8px; }
  .doc-body { flex: 1; overflow: auto; padding: 8px 28px 24px; }
  .doc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .md { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4 { font-size: 14px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { padding: 1px 5px; border-radius: var(--radius-sm); background: var(--muted); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { max-height: none; margin: 10px 0; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted-foreground); }
  .md hr { margin: 16px 0; border: 0; border-top: 1px solid var(--border); }
  .md table { margin: 10px 0; }
  .md th, .md td { border: 1px solid var(--border); }
  .md .ac { padding: 1px 6px; border-radius: var(--radius-sm); background: color-mix(in oklch, var(--info) 14%, transparent); color: var(--info); font-weight: 600; font-size: 12.5px; }

  /* Approve and build: press and hold. A fill sweeps across while it counts 3, 2, 1; letting go
     cancels; at the end 🚀 rises and the approval goes out. Subtle on purpose. */
  button.act.hold { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button.act.hold::before { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: color-mix(in oklch, var(--primary-foreground) 16%, transparent); transition: transform 0.2s ease-out; pointer-events: none; }
  button.act.hold.holding::before { transform: scaleX(1); transition: transform 2.4s linear; }
  button.act.hold > span { position: relative; }

    if (o[k] === null || typeof o[k] !== "object") o[k] = typeof path[i + 1] === "number" ? [] : {};
    o = o[k];
  }
  const last = path[path.length - 1];
  o[last] = (typeof o[last] === "string" ? o[last] : "") + delta;
}
/** The text of `file` as the agent is writing it now, or null when no call is writing it. */
function liveDraft(ticket, file) {
  if (!live || live.ticketId !== ticket?.id || live.file !== file) return null;
  for (const call of [...live.calls.values()].reverse()) {
    const a = call.args || {};
    const path = String(a.path || a.file_path || "");
    if (!(path === file || path.endsWith(`/${file}`))) continue;
    if (call.name === "write" && typeof a.content === "string") return a.content;
    if (call.name === "edit" && Array.isArray(a.edits)) {
      let text = reader.files[file] || "";
      for (const e of a.edits) if (e && typeof e.oldText === "string" && e.oldText && text.includes(e.oldText)) text = text.replace(e.oldText, typeof e.newText === "string" ? e.newText : "");
      return text;
    }
  }
  return null;
}
function drawLiveBanner() {
  const box = $("doc-live");
  if (!live || live.ticketId !== reader.ticket?.id || reader.name !== live.file || live.done) { box.replaceChildren(); return; }
  const writing = liveDraft(reader.ticket, live.file) !== null;
  box.replaceChildren(el("div", { class: `doc-live${writing ? "" : " idle"}` },
    writing ? inPhase(el("span", { class: "live-dot" }), 2000) : null,
    el("span", {}, writing ? `${live.step.name} is writing ${live.file}: live` : `${live.step.name} is working (reading the code, thinking). ${live.file} appears here as it is written.`)));
}
let liveFrame = 0;
function drawLive() {
  if (liveFrame) return;
  liveFrame = setTimeout(() => {
    liveFrame = 0;
    if (!$("doc").open || !live || reader.name !== live.file || !$("suggest").hidden) return drawLiveBanner();
    const body = $("doc-content").parentElement;
    const follow = body.scrollHeight - body.scrollTop - body.clientHeight < 120; // at the bottom: follow the writing
    const draft = liveDraft(reader.ticket, live.file);
    const text = draft ?? reader.files[live.file] ?? "";
    $("doc-content").replaceChildren(...markdown(text));
    $("doc-content").classList.toggle("writing", draft !== null);
    if (draft === null) drawDiagrams($("doc-content"));
    drawLiveBanner();
    if (follow) body.scrollTop = body.scrollHeight;
  }, 120);
}
async function refreshLiveFiles() {
  if (!live) return;
  try {
    const data = await api(`/api/tickets/${encodeURIComponent(live.ticketId)}`);
    if (reader.ticket?.id === data.ticket.id) { reader.ticket = data.ticket; reader.files = data.files; }
    const step = data.ticket.steps.find((x) => x.name === live?.step.name);
    if (live && step && step.status !== "running") live.done = true;
  } catch { /* the next event or refresh tries again */ }
  drawLive();
}
function stopLive() { live?.source.close(); live = null; }
/** Open the reader on the spec or plan of a step; live while the step runs. */
function openStepDoc(t, step, files) {
  const file = docFor(step.role);
  const names = ["spec.md", "plan.md"].filter((n) => files[n] || n === file);
  stopLive();
  if (step.status === "running") {
    live = { ticketId: t.id, step, file, calls: new Map(), source: null, done: false };
    const source = new EventSource(`/api/tickets/${encodeURIComponent(t.id)}/events?conversation=${step.conversationId}`);
    live.source = source;
    source.onmessage = (m) => {
      if (!live || live.source !== source) return;
      const e = JSON.parse(m.data);
      if (e.type === "snapshot") for (const c of e.calls || []) live.calls.set(c.index, { name: c.name, args: structuredClone(c.args || {}) });
      else if (e.type === "delta") for (const c of e.calls || []) {
        if (c.type === "call_start") live.calls.set(c.index, { name: c.name, args: structuredClone(c.args || {}) });
        else { const call = live.calls.get(c.index); if (call) appendAt(call.args, c.path, c.delta); }
      }
      else if (e.type === "tool_end") { live.calls.clear(); refreshLiveFiles(); return; } // the file is on disk now
      else if (e.type === "run_end") { live.calls.clear(); refreshLiveFiles(); return; }
      drawLive();
    };
  }
  openDoc(t, files, names, file);
  const body = $("doc-content").parentElement;
  if (live) body.scrollTop = body.scrollHeight;
}
$("doc").addEventListener("close", stopLive);
$("doc-close").addEventListener("click", () => $("doc").close());
$("doc").addEventListener("click", (e) => { if (e.target === $("doc")) $("doc").close(); }); // the backdrop
$("doc-copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(reader.files[reader.name] || ""); flash(`${reader.name} copied`); } catch { flash("copy failed: the browser refused the clipboard", true); } });
// Approve and build is pressed and held (pointer, touch, or Space/Enter): 3, 2, 1 while held, then 🚀
// and the approval goes out. Letting go before the end cancels, so a stray click never starts a build.
const HOLD_STEP_MS = 800;
let launching = null;
function holdToApprove(button, ticket, note, after) {
  const label = "Approve and build";
  const show = (...kids) => button.replaceChildren(...kids.map((k) => (typeof k === "string" ? el("span", {}, k) : k)));
  button.classList.add("hold");
  button.title = "Press and hold to approve";
  show(label);
  let timer = null, n = 0, going = false, hint = null;
  const idle = () => { button.classList.remove("holding"); button.style.minWidth = ""; show(label); };
  const tick = () => {
    if (n > 0) { show(el("span", { class: "count" }, String(n))); n--; timer = setTimeout(tick, HOLD_STEP_MS); return; }
    timer = null;
    going = true;
    const t = ticket();
    button.classList.remove("holding");
    button.classList.add("go");
    button.setAttribute("aria-disabled", "true");
    show(el("span", { class: "rocket", "aria-hidden": "true" }, "🚀"), el("span", { class: "count" }, "Lessgoo!!"));
    api(`/api/tickets/${t.id}/approve`, { note: note() })
      .then(() => {
        // Approved: the button stays approved until the panel shows the build (it never goes back).
        noteDrafts.delete(t.id);
        flash(`${t.cid} approved: the build starts 🚀`);
        setTimeout(() => { show(el("span", { class: "count" }, "Approved ✓")); launching = null; refresh(); after?.(); }, 700);
      })
      .catch((e) => { flash(e.message, true); going = false; launching = null; button.classList.remove("go"); button.removeAttribute("aria-disabled"); idle(); });
  };
  // The reader's button lives on: a new reader starts it fresh.
  button.resetHold = () => { if (!timer) { going = false; button.classList.remove("go", "holding"); button.removeAttribute("aria-disabled"); idle(); } };
  const start = (e) => {
    if (timer || going || button.disabled) return;
    e.preventDefault();
    clearTimeout(hint);
    button.style.minWidth = `${button.offsetWidth}px`;
    void button.offsetWidth; // so the fill starts from empty
    button.classList.add("holding");
    launching = {};
    n = 3;
    tick();
  };
  const stop = () => {
    if (!timer || going) return;
    clearTimeout(timer);
    timer = null;
    launching = null;
    idle();
    show("Keep holding…");
    hint = setTimeout(() => show(label), 1200);
  };
  button.addEventListener("pointerdown", (e) => { if (e.button === 0) start(e); });
  for (const type of ["pointerup", "pointerleave", "pointercancel"]) button.addEventListener(type, stop);
  button.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); else if (e.key === " " || e.key === "Enter") e.preventDefault(); });
  button.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") stop(); });
  button.addEventListener("click", (e) => e.preventDefault()); // a click alone does nothing
  button.addEventListener("contextmenu", (e) => e.preventDefault()); // a long press on touch is not a menu
  return button;
}
holdToApprove($("doc-approve"), () => reader.ticket, () => $("approve-note")?.value || "", () => $("doc").close());

// ---- model spend and limits ----
function drawUsage(u) {
  if (!u) return;
  const spent = u.today.total.cost, budget = u.limits.dailyBudgetUsd;
  $("spend").textContent = budget > 0 ? `${money(spent)} / ${money(budget)}` : money(spent);
  const share = budget > 0 ? Math.min(1, spent / budget) : 0;
  $("spend-fill").style.width = `${Math.round(share * 100)}%`;
  $("spend-fill").className = `meter-fill${share >= 1 ? " bad" : share >= 0.8 ? " warn" : ""}`;
  setStat("stat-spend", money(spent));
  $("stat-spend-sub").textContent = `${budget > 0 ? `of ${money(budget)} · ` : "no daily budget · "}${u.today.total.requests} requests`;
  const waits = u.waiting.filter((w) => !/ is paused /.test(w.reason));
  $("waiting").hidden = waits.length === 0;
  $("waiting").textContent = waits.length ? `${waits.length} request${waits.length > 1 ? "s" : ""} waiting: ${waits[0].reason}` : "";
  $("banner").hidden = !u.budgetReached;
  $("banner-text").textContent = u.budgetReached ? `Daily budget reached: ${money(spent)} of ${money(budget)} spent today. Running tickets are paused and continue when the budget is back (tomorrow, or raise DAILY_BUDGET_USD and restart).` : "";
}

// ---- refresh ----
// Never redraw under your cursor: a steer or an approval note you are typing stays.
const typing = () => document.activeElement && $("detail").contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
function applyOverview(data) {
  overview = data;
  PHASE_LABEL = Object.fromEntries((overview.phases || []).map((p) => [p.phase, p.label]));
  drawUsage(overview.usage);
  drawSentry(); drawRuns(); drawSprint();
  $("status").textContent = `${streamOk ? "live" : "updated"} ${new Date().toLocaleTimeString()}`;
}
/** Fetch everything now (after an action, or while the stream is down). */
async function refresh() {
  try {
    applyOverview(await api("/api/overview"));
    if (openId && !typing()) await drawDetail(false);
  } catch (e) { flash(e.message, true); }
}
// The state stream: the server pushes the overview, and the open ticket, the moment they change.
// While it is down (a restart), the browser polls every 5 s; EventSource reconnects by itself.
let stream = null, streamFor = null, streamOk = false;
function connect() {
  const want = openId || "";
  if (stream && streamFor === want) return;
  stream?.close();
  streamFor = want;
  stream = new EventSource(`/api/stream${want ? `?ticket=${encodeURIComponent(want)}` : ""}`);
  stream.addEventListener("overview", (m) => { streamOk = true; applyOverview(JSON.parse(m.data)); });
  stream.addEventListener("ticket", (m) => {
    const data = JSON.parse(m.data);
    if (data.ticket && data.ticket.id === openId && !typing()) drawDetail(false, data);
  });
  stream.onerror = () => { streamOk = false; };
}
refresh();
connect();
loadSprint(false);
setInterval(() => { if (!streamOk) refresh(); }, 5000);
setInterval(() => tab === "sprint" && loadSprint(false), 60000);
</script>
