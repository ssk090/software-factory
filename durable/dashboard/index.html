<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software factory</title>
<link rel="icon" href="data:,">
<style>
  /* Tokens: shadcn/ui neutral theme (oklch) plus status and sidebar tokens. See DESIGN.md. */
  :root {
    --radius: 0.625rem;
    --radius-sm: calc(var(--radius) - 4px); --radius-md: calc(var(--radius) - 2px); --radius-lg: var(--radius); --radius-xl: calc(var(--radius) + 4px);
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0); --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
    --success: oklch(0.527 0.154 150.069); --warning: oklch(0.555 0.163 48.998); --info: oklch(0.488 0.243 264.376);
    --violet: oklch(0.541 0.247 293.009); --teal: oklch(0.511 0.096 186.391);
    --sidebar: oklch(0.985 0 0); --sidebar-foreground: oklch(0.145 0 0); --sidebar-accent: oklch(0.97 0 0); --sidebar-border: oklch(0.922 0 0);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0); --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%); --ring: oklch(0.556 0 0);
      --success: oklch(0.723 0.219 149.579); --warning: oklch(0.769 0.188 70.08); --info: oklch(0.623 0.214 259.815);
      --violet: oklch(0.702 0.183 293.541); --teal: oklch(0.777 0.152 181.912);
      --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --sidebar-accent: oklch(0.269 0 0); --sidebar-border: oklch(1 0 0 / 10%);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 15px; } h3 { font-size: 13px; margin: 16px 0 8px; }
  .muted { color: var(--muted-foreground); }
  a { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--muted-foreground); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--foreground); }
  .error { color: var(--destructive); }
  .grow { flex: 1; }
  #detail .bar > input[type=text] { flex: 1; width: auto; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  /* Layout: shadcn sidebar block (sidebar-07) with an inset content area */
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 0.2s ease; }
  .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); }
  .sidebar-head { display: flex; align-items: center; gap: 8px; padding: 4px 0 16px 8px; }
  .brand { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; font-weight: 600; white-space: nowrap; }
  .icon-btn { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; cursor: pointer; }
  .icon-btn:hover { background: var(--sidebar-accent); }
  .ic { flex: none; width: 16px; height: 16px; }
  .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-foreground); font-size: 12px; font-weight: 600; }
  .nav-label { padding: 12px 8px 4px; font-size: 12px; color: var(--muted-foreground); }
  nav#tabs { display: flex; flex-direction: column; gap: 2px; }
  nav#tabs button { white-space: nowrap; display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-md); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  nav#tabs button:hover { background: var(--sidebar-accent); }
  nav#tabs button.on { background: var(--sidebar-accent); font-weight: 500; }
  nav#tabs button .label { flex: 1; }
  nav#tabs button .count { font-size: 12px; font-variant-numeric: tabular-nums; }
  .sidebar-foot { margin-top: auto; padding: 8px; font-size: 12px; }
  .page { min-width: 0; padding: 24px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
  main.open { grid-template-columns: minmax(0, 1fr) minmax(380px, 42%); gap: 16px; }
  main > div { min-width: 0; }

  /* Cards: shadcn Card; stat cards are the SectionCards pattern */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .stat, section.card, aside { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); min-width: 0; }
  .stat { padding: 16px; }
  .stat .label { font-size: 13px; color: var(--muted-foreground); }
  .stat .value { margin-top: 4px; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  section.card, aside { padding: 16px; }
  section.card { overflow-x: auto; }
  aside { display: none; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow: auto; }
  main.open aside { display: block; }

  /* Table: shadcn Table */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { height: 36px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); }
  td { font-size: 14px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }
  tr.click { cursor: pointer; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.nowrap { white-space: nowrap; }
  td.row-end { width: 1%; padding-top: 4px; padding-bottom: 4px; text-align: right; white-space: nowrap; }
  button.act.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  /* A row's remove icon (Button variant="ghost" size="icon"): the first click arms it, the second removes */
  .row-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); cursor: pointer; transition: background-color 0.15s, color 0.15s, border-color 0.15s, width 0.15s; }
  .row-icon:hover { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
  .row-icon:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .row-icon.armed { width: auto; gap: 4px; padding: 0 8px; grid-auto-flow: column; border-color: color-mix(in oklch, var(--destructive) 45%, transparent); background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); font-size: 12px; font-weight: 500; }
  .row-icon:disabled { opacity: 0.5; pointer-events: none; }
  tr.leaving { opacity: 0; transform: translateX(8px); transition: opacity 0.18s, transform 0.18s; }
  .score { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Button: shadcn Button (outline by default, primary for the main action) */
  button.act { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); color: var(--foreground); font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); transition: background-color 0.15s, color 0.15s; }
  button.act:hover { background: var(--accent); color: var(--accent-foreground); }
  button.act.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  button.act.primary:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  button.act:disabled { opacity: 0.5; pointer-events: none; }

  /* Input, Select, Textarea */
  input[type=text], select, textarea { font: inherit; color: var(--foreground); background: var(--background); border: 1px solid var(--input); border-radius: var(--radius-md); height: 36px; padding: 0 12px; min-width: 0; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
  input[type=text] { width: 100%; }
  textarea { width: 100%; height: auto; padding: 8px 12px; }
  input::placeholder, textarea::placeholder { color: var(--muted-foreground); }
  input[type=text]:focus-visible, select:focus-visible, textarea:focus-visible, button.act:focus-visible, nav#tabs button:focus-visible, .icon-btn:focus-visible, summary:focus-visible { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }

  /* Badge: shadcn Badge, tinted for status */
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--foreground); }
  .chip.ok { color: var(--success); border-color: color-mix(in oklch, var(--success) 40%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); }
  .chip.warn { color: var(--warning); border-color: color-mix(in oklch, var(--warning) 40%, transparent); background: color-mix(in oklch, var(--warning) 10%, transparent); }
  .chip.bad { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 40%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); }
  .chip.run { color: var(--info); border-color: color-mix(in oklch, var(--info) 40%, transparent); background: color-mix(in oklch, var(--info) 10%, transparent); }

  /* Empty and Alert */
  td.empty { padding: 32px 8px; text-align: center; color: var(--muted-foreground); }
  .card > .error, aside > .error { margin-bottom: 12px; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--destructive) 40%, transparent); border-radius: var(--radius-md); background: color-mix(in oklch, var(--destructive) 10%, transparent); }

  /* Code and the live feed: shadcn muted surface */
  pre, .live { margin: 0; background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius-md); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .live { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow: auto; padding: 8px; }
  /* Live blocks: one box per message or tool call, each kind in its own light shade */
  /* oklab, not oklch: mixed with a grey, oklch takes the grey's hue (0, red) and every shade turns pink */
  .lb { --c: var(--muted-foreground); padding: 6px 9px; border: 1px solid color-mix(in oklab, var(--c) 30%, var(--border)); border-radius: var(--radius-md); background: color-mix(in oklab, var(--c) 9%, var(--card)); animation: fade-up 0.18s ease-out; }
  .lb-head { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 3px; font: 600 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.02em; color: var(--c); }
  .lb-tag { white-space: nowrap; text-transform: uppercase; }
  .lb-meta { min-width: 0; overflow: hidden; color: var(--muted-foreground); font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; text-transform: none; letter-spacing: 0; }
  .lb-state { margin-left: auto; font-weight: 500; white-space: nowrap; text-transform: none; }
  .lb-body { color: var(--foreground); white-space: pre-wrap; word-break: break-word; }
  .lb-body:empty { display: none; }
  .lb-out { max-height: 220px; margin-top: 5px; padding: 6px 8px; overflow: auto; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--background) 65%, transparent); color: var(--muted-foreground); white-space: pre-wrap; word-break: break-word; }
  .lb-out:empty { display: none; }
  .lb details summary { color: var(--muted-foreground); font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .lb details { padding: 0; border: 0; }
  .lb-agent { --c: var(--info); }
  .lb-bash { --c: var(--warning); }
  .lb-read { --c: var(--success); }
  .lb-write { --c: var(--violet); }
  .lb-steer { --c: var(--teal); }
  .lb-error { --c: var(--destructive); }
  .lb-prompt, .lb-tool, .lb-note { --c: var(--muted-foreground); }
  .lb-note { padding: 2px 9px; border-style: dashed; background: none; color: var(--muted-foreground); font-size: 11.5px; }
  .lb.running .lb-state::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--c); vertical-align: 1px; animation: pulse 2s ease-out infinite; }
  details { border-top: 1px solid var(--border); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 500; border-radius: var(--radius-sm); }

  /* Collapsed sidebar: an icon rail (wide screens only) */
  @media (min-width: 761px) {
    .shell.collapsed { grid-template-columns: 56px minmax(0, 1fr); }
    .shell.collapsed .sidebar { align-items: center; padding: 16px 8px; }
    .shell.collapsed .sidebar-head { flex-direction: column; padding: 4px 0 16px; }
    .shell.collapsed .brand { flex: none; }
    .shell.collapsed .brand-name, .shell.collapsed .nav-label, .shell.collapsed nav#tabs .label, .shell.collapsed .count, .shell.collapsed .sidebar-foot { display: none; }
    .shell.collapsed nav#tabs { width: 100%; }
    .shell.collapsed nav#tabs button { justify-content: center; padding: 8px; }
  }

  /* Toasts: shadcn Sonner */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(356px, calc(100vw - 32px)); pointer-events: none; }
  .toast { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 4px 12px rgb(0 0 0 / 0.1); font-size: 13px; cursor: pointer; pointer-events: auto; animation: toast-in 0.2s ease-out; }
  .toast .ic { margin-top: 2px; }
  .toast.success .ic { color: var(--success); }
  .toast.error { border-color: color-mix(in oklch, var(--destructive) 40%, var(--border)); }
  .toast.error .ic { color: var(--destructive); }
  .toast.out { opacity: 0; transform: translateY(8px); transition: opacity 0.15s, transform 0.15s; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  /* Spend meter (sidebar foot) and the budget banner (Alert) */
  .meter { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .meter-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .meter-head strong { font-weight: 500; font-variant-numeric: tabular-nums; }
  .meter-track { height: 6px; border-radius: 999px; background: var(--sidebar-accent); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: inherit; background: var(--primary); transition: width 0.4s ease, background-color 0.2s; }
  .meter-fill.warn { background: var(--warning); } .meter-fill.bad { background: var(--destructive); }
  .meter-note { font-size: 12px; color: var(--warning); }
  .banner { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 16px; padding: 10px 14px; border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); border-radius: var(--radius-lg); background: color-mix(in oklch, var(--warning) 10%, transparent); font-size: 13px; }
  .banner .ic { margin-top: 2px; color: var(--warning); }
  .stat .sub { margin-top: 2px; font-size: 12px; color: var(--muted-foreground); }

  /* Ticket detail: controls, Tabs (segmented), the timeline, the log */
  .notice { margin-bottom: 12px; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--warning) 40%, transparent); border-radius: var(--radius-md); background: color-mix(in oklch, var(--warning) 10%, transparent); font-size: 13px; }
  .summary { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; gap: 2px; margin: 12px 0; padding: 3px; border-radius: var(--radius-lg); background: var(--muted); }
  .seg button { padding: 4px 12px; border: 0; border-radius: var(--radius-md); background: none; color: var(--muted-foreground); font: inherit; font-size: 13px; cursor: pointer; transition: background-color 0.15s, color 0.15s, box-shadow 0.15s; }
  .seg button.on { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  .seg button:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .seg .n { margin-left: 4px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .chip.sm { height: 18px; padding: 0 6px; font-size: 11px; }
  .tl { position: relative; margin: 0; padding: 0; list-style: none; }
  .tl-item { position: relative; padding: 0 0 14px 24px; }
  .tl-item::before { content: ""; position: absolute; top: 18px; bottom: 0; left: 7px; width: 1px; background: var(--border); }
  .tl-item:last-child::before { display: none; }
  .tl-dot { position: absolute; top: 5px; left: 2px; width: 11px; height: 11px; border: 2px solid var(--border); border-radius: 50%; background: var(--card); transition: background-color 0.2s, border-color 0.2s; }
  .tl-item.done .tl-dot { border-color: var(--success); background: var(--success); }
  .tl-item.current .tl-dot { border-color: var(--info); background: var(--info); animation: pulse 2s ease-out infinite; }
  .tl-item.paused .tl-dot, .tl-item.waiting .tl-dot { border-color: var(--warning); background: var(--warning); }
  .tl-item.failed .tl-dot { border-color: var(--destructive); background: var(--destructive); }
  .tl-item.stopped .tl-dot { border-color: var(--muted-foreground); }
  .tl-item.next { opacity: 0.55; }
  .tl-item.next .tl-dot { border-style: dashed; }
  .tl-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tl-title { font-weight: 500; }
  .tl-time { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-steps { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .tl-step { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13px; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
  .tl-step:hover { background: color-mix(in oklch, var(--muted) 60%, transparent); }
  .tl-step.watching { border-color: var(--ring); }
  .tl-step:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
  .tl-step .name { white-space: nowrap; }
  .tl-step .model { min-width: 0; overflow: hidden; color: var(--muted-foreground); text-overflow: ellipsis; white-space: nowrap; }
  .tl-step .meta { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-note { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
  .tl-note.warn { color: var(--warning); } .tl-note.error { color: var(--destructive); }
  /* A message in the timeline: its own block, shaded by its level */
  .tl-msg { --c: var(--muted-foreground); padding: 6px 9px; border: 1px solid color-mix(in oklab, var(--c) 28%, var(--border)); border-radius: var(--radius-md); background: color-mix(in oklab, var(--c) 6%, var(--card)); font-size: 12.5px; }
  .tl-msg.warn { --c: var(--warning); } .tl-msg.error { --c: var(--destructive); }
  .tl-msg.k-repair { --c: var(--violet); } .tl-msg.k-lesson { --c: var(--teal); }
  .tl-msg.error.k-repair { --c: var(--destructive); }
  .tl-msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 11px; }
  .tl-msg-tag { font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--c); }
  .tl-msg-time { color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .tl-msg-more { margin-left: auto; padding: 0 4px; border: 0; background: none; color: var(--info); font: inherit; cursor: pointer; }
  .tl-msg.result.ok { --c: var(--success); }
  .tl-msg.result { padding: 10px 12px; }
  .result-title { font-size: 14px; font-weight: 600; color: var(--foreground); }
  .result-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; }
  .result-facts a { font-weight: 600; }
  .result-sum { margin-top: 6px; color: var(--muted-foreground); font-size: 12.5px; }
  .tl-msg-body { color: var(--foreground); white-space: pre-wrap; word-break: break-word; }
  .tl-msg-body.folded { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* Documents: cards in the approval box, and the reader (shadcn Dialog) with rendered Markdown */
  .approve { margin-bottom: 4px; }
  .approve p { margin: 0 0 10px; font-size: 13px; }
  .doc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .doc-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color 0.15s, background-color 0.15s, transform 0.15s; }
  .doc-card:hover { border-color: var(--ring); background: color-mix(in oklch, var(--muted) 50%, transparent); }
  .doc-card:active { transform: scale(0.99); }

  .doc-card .ic { width: 20px; height: 20px; color: var(--muted-foreground); }
  .doc-card .doc-name { font-weight: 500; }
  .doc-card .doc-meta { font-size: 12px; color: var(--muted-foreground); }
  .doc-card .go { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
  .file-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .file-row:last-child { border-bottom: 0; }
  .file-row .doc-meta { font-size: 12px; color: var(--muted-foreground); }
  dialog.doc { display: none; flex-direction: column; width: min(880px, calc(100vw - 48px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); color: var(--card-foreground); box-shadow: 0 16px 48px -12px rgb(0 0 0 / 0.4); }
  dialog.doc[open] { display: flex; animation: dialog-in 0.18s ease-out; }
  dialog.doc::backdrop { background: rgb(0 0 0 / 0.5); backdrop-filter: blur(2px); }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(6px) scale(0.985); } }
  .doc-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .doc-head .seg { margin: 0; }
  .doc-head h2 { margin-right: 8px; }
  .doc-body { flex: 1; overflow: auto; padding: 8px 28px 24px; }
  .doc-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .md { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4 { font-size: 14px; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { padding: 1px 5px; border-radius: var(--radius-sm); background: var(--muted); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { max-height: none; margin: 10px 0; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted-foreground); }
  .md hr { margin: 16px 0; border: 0; border-top: 1px solid var(--border); }
  .md table { margin: 10px 0; }
  .md th, .md td { border: 1px solid var(--border); }
  .md .ac { padding: 1px 6px; border-radius: var(--radius-sm); background: color-mix(in oklch, var(--info) 14%, transparent); color: var(--info); font-weight: 600; font-size: 12.5px; }

  /* Approve and build: press and hold. A fill sweeps across while it counts 3, 2, 1; letting go
     cancels; at the end 🚀 rises and the approval goes out. Subtle on purpose. */
  button.act.hold { position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button.act.hold::before { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: color-mix(in oklch, var(--primary-foreground) 16%, transparent); transition: transform 0.2s ease-out; pointer-events: none; }
  button.act.hold.holding::before { transform: scaleX(1); transition: transform 2.4s linear; }
  button.act.hold > span { position: relative; }
  button.act .count { display: inline-block; font-variant-numeric: tabular-nums; animation: tick-in 0.25s ease-out; }
  button.act.primary.go { background: var(--success); border-color: var(--success); color: oklch(0.985 0 0); pointer-events: none; transition: background-color 0.25s, border-color 0.25s; }
  button.act .rocket { display: inline-block; margin-right: 6px; animation: rise 1s ease-out forwards; }
  @keyframes tick-in { from { opacity: 0; transform: translateY(3px); } }
  @keyframes rise { 0% { opacity: 0; transform: translateY(5px); } 35% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translate(4px, -4px); } }

  /* Live preview: a file the agent is writing, as it writes it */
  .doc-live { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--info) 40%, var(--border)); border-radius: var(--radius-md); background: color-mix(in oklch, var(--info) 8%, transparent); font-size: 13px; }
  .doc-live.idle { border-color: var(--border); background: var(--muted); color: var(--muted-foreground); }
  .md.writing > :last-child::after { content: ""; display: inline-block; width: 7px; height: 1.1em; margin-left: 2px; vertical-align: text-bottom; background: var(--info); animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .tl-step .preview { font-size: 12px; color: var(--info); white-space: nowrap; }
  .tl-step .model { flex-shrink: 1; min-width: 4ch; }
  #doc-tabs:empty { display: none; }

  /* Diff drawer: what one agent step changed (shadcn Sheet, code lines after px0) */
  dialog.sheet { display: none; flex-direction: column; position: fixed; inset: 0 0 0 auto; width: min(1120px, 96vw); max-width: none; height: 100vh; max-height: none; margin: 0; padding: 0; border: 0; border-left: 1px solid var(--border); background: var(--card); color: var(--card-foreground); box-shadow: -16px 0 48px -12px rgb(0 0 0 / 0.35); }
  dialog.sheet[open] { display: flex; animation: sheet-in 0.22s ease-out; }
  dialog.sheet::backdrop { background: rgb(0 0 0 / 0.4); }
  @keyframes sheet-in { from { opacity: 0; transform: translateX(28px); } }
  .sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
  .sheet-head h2 { margin-bottom: 6px; }
  .sheet-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
  .sheet-sub code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .commits { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; font-size: 12px; }
  .commits span.sha { margin-right: 6px; color: var(--violet); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sheet-main { display: grid; flex: 1; grid-template-columns: 270px minmax(0, 1fr); min-height: 0; }
  .diff-nav { overflow: auto; padding: 8px; border-right: 1px solid var(--border); }
  .diff-nav .file { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px; border: 0; border-radius: var(--radius-sm); background: none; color: inherit; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: left; cursor: pointer; transition: background-color 0.15s; }
  .diff-nav .file:hover, .diff-nav .file.on { background: var(--muted); }
  .fs { width: 1.2ch; flex: none; font-weight: 700; }
  .fs.A { color: var(--success); } .fs.D { color: var(--destructive); } .fs.M { color: var(--warning); } .fs.R { color: var(--info); }
  .fpath { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fpath .dir { color: var(--muted-foreground); }
  .fstat { flex: none; font-size: 11px; white-space: nowrap; }
  .fstat .a, .dfile-head .a { color: var(--success); } .fstat .d, .dfile-head .d { color: var(--destructive); }
  .diff-view { overflow: auto; padding: 12px 16px 40px; }
  .dfile { margin-bottom: 14px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); animation: fade-up 0.18s ease-out; }
  .dfile-head { position: sticky; top: -12px; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 85%, var(--card)); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; }
  .dfile.closed .dfile-head { border-bottom: 0; }
  .dfile-head .twist { width: 1ch; color: var(--muted-foreground); transition: transform 0.15s; }
  .dfile:not(.closed) .dfile-head .twist { transform: rotate(90deg); }
  .dfile-body { overflow-x: auto; }
  .dfile.closed .dfile-body { display: none; }
  table.code { width: 100%; border-collapse: collapse; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  table.code td { height: auto; padding: 0 8px; border: 0; vertical-align: top; font-size: 12px; }
  table.code tbody tr:hover { background: none; }
  table.code td.ln { width: 1%; padding: 0 6px; color: var(--muted-foreground); text-align: right; white-space: nowrap; user-select: none; font-variant-numeric: tabular-nums; }
  table.code td.sg { width: 1%; padding: 0 4px; color: var(--muted-foreground); user-select: none; }
  table.code td.tx { white-space: pre; }
  table.code tr.add { background: color-mix(in oklab, var(--success) 11%, transparent); }
  table.code tr.add td.ln { background: color-mix(in oklab, var(--success) 18%, transparent); }
  table.code tr.add td.sg { color: var(--success); }
  table.code tr.del { background: color-mix(in oklab, var(--destructive) 10%, transparent); }
  table.code tr.del td.ln { background: color-mix(in oklab, var(--destructive) 17%, transparent); }
  table.code tr.del td.sg { color: var(--destructive); }
  table.code tr.hunk td { padding: 3px 10px; background: color-mix(in oklab, var(--info) 8%, transparent); color: var(--muted-foreground); }
  table.code tr.note td { color: var(--muted-foreground); font-style: italic; }
  .tok-k { color: var(--violet); } .tok-s { color: var(--teal); } .tok-c { color: var(--muted-foreground); font-style: italic; } .tok-n { color: var(--warning); }
  .dfile-more { padding: 10px; color: var(--muted-foreground); font-size: 12px; text-align: center; }
  .tl-step .diffhint { font-size: 12px; color: var(--violet); white-space: nowrap; }
  /* The code the agent is typing now (its write or edit call, streamed from the model) */
  .dfile.pending { border-color: color-mix(in oklab, var(--info) 45%, var(--border)); }
  .dfile.pending .dfile-head { background: color-mix(in oklab, var(--info) 10%, var(--card)); cursor: default; }
  .dfile.pending tbody tr:last-child td.tx::after, .lb.writing .lb-code tbody tr:last-child td.tx::after { content: ""; display: inline-block; width: 7px; height: 1.1em; margin-left: 1px; vertical-align: text-bottom; background: var(--info); animation: caret 1s steps(1) infinite; }
  /* Word emphasis on a changed line (the words that changed, after pi-code-previews) */
  table.code tr.add .wd { border-radius: 2px; background: color-mix(in oklab, var(--success) 30%, transparent); }
  table.code tr.del .wd { border-radius: 2px; background: color-mix(in oklab, var(--destructive) 28%, transparent); }
  /* Previews inside the Live blocks: an edit as a small diff, a write's first lines, grep by file */
  .lb-code { margin-top: 4px; overflow-x: auto; border-radius: var(--radius-sm); background: color-mix(in oklab, var(--background) 65%, transparent); }
  .lb-code table.code td { line-height: 1.5; }
  .lb-flag { padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .lb-flag.risky { background: color-mix(in oklab, var(--destructive) 16%, transparent); color: var(--destructive); }
  .lb-flag.secret { background: color-mix(in oklab, var(--warning) 18%, transparent); color: var(--warning); }
  .lb-grep-file { margin-top: 4px; color: var(--c); font-weight: 600; }
  .lb-grep-line { display: flex; gap: 8px; }
  .lb-grep-line .n { min-width: 4ch; color: var(--muted-foreground); text-align: right; }

  /* Mermaid diagrams in the reader */
  .mermaid-box { margin: 12px 0; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); overflow-x: auto; text-align: center; }
  .mermaid-box svg { max-width: 100%; height: auto; }
  .mermaid-box.loading { min-height: 80px; color: var(--muted-foreground); font-size: 12px; display: grid; place-items: center; }

  /* Ask for a change: select text in the spec or plan (a Popover with a Textarea) */
  .suggest { position: fixed; z-index: 60; width: 360px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); color: var(--card-foreground); box-shadow: 0 12px 32px -8px rgb(0 0 0 / 0.35); animation: fade-up 0.15s ease-out; }
  .suggest-quote { max-height: 64px; overflow: hidden; margin-bottom: 8px; padding-left: 8px; border-left: 2px solid var(--info); color: var(--muted-foreground); font-size: 12px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .suggest textarea { font-size: 13px; resize: vertical; }
  .suggest-foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .suggest-who { font-size: 11.5px; color: var(--muted-foreground); }
  .md ::selection { background: color-mix(in oklch, var(--info) 30%, transparent); }
  .revising { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; padding: 8px 12px; border: 1px solid color-mix(in oklch, var(--info) 40%, var(--border)); border-radius: var(--radius-md); background: color-mix(in oklch, var(--info) 8%, transparent); font-size: 13px; }
  .revising.failed { border-color: color-mix(in oklch, var(--destructive) 40%, var(--border)); background: color-mix(in oklch, var(--destructive) 8%, transparent); }
  .revisions { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 12.5px; }
  .revisions .rev { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .revisions .rev span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Stage track: where the run is, at a glance (the stage in progress glows and its stripes move) */
  .stages { margin-bottom: 16px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-xl); }
  .stage-track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .stage-bar { height: 8px; border-radius: 999px; background: var(--muted); transition: background-color 0.3s, box-shadow 0.3s; }
  .stage-name { margin-top: 8px; color: var(--muted-foreground); font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.02em; transition: color 0.3s; }
  .stage.done .stage-bar { background: var(--success); }
  .stage.done .stage-name { color: var(--foreground); }
  .stage.current .stage-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklch, var(--info) 80%, transparent) 0 5px, color-mix(in oklch, var(--info) 30%, transparent) 5px 10px); background-size: 14.142px 14.142px; animation: stripes 0.9s linear infinite, glow 2s ease-in-out infinite; }
  .stage.current .stage-name { color: var(--info); font-weight: 600; }
  .stage.waiting .stage-bar, .stage.paused .stage-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklch, var(--warning) 75%, transparent) 0 5px, color-mix(in oklch, var(--warning) 28%, transparent) 5px 10px); background-size: 14.142px 14.142px; }
  .stage.waiting .stage-bar { animation: glow-warn 2.4s ease-in-out infinite; }
  .stage.waiting .stage-name, .stage.paused .stage-name { color: var(--warning); font-weight: 600; }
  .stage.failed .stage-bar { background: var(--destructive); }
  .stage.failed .stage-name { color: var(--destructive); font-weight: 600; }
  .stage.stopped .stage-bar { background: var(--muted-foreground); }
  .stage.skipped .stage-bar { background: transparent; box-shadow: inset 0 0 0 1px var(--border); }
  .stage.skipped .stage-name { opacity: 0.6; text-decoration: line-through; }
  .stage-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
  .stage .stage-parts .stage-bar { border-radius: 0; }
  .stage .stage-parts .stage-bar:first-child { border-radius: 999px 0 0 999px; }
  .stage .stage-parts .stage-bar:last-child { border-radius: 0 999px 999px 0; }
  .stage .stage-bar.part.next { background: var(--muted); animation: none; box-shadow: none; }
  .stage .stage-bar.part.done { background: var(--success); animation: none; box-shadow: none; }
  .stage-now { margin-top: 14px; }
  .stage-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .stage-sub { margin-top: 2px; font-size: 13px; color: var(--muted-foreground); }
  .tl-step.running { border-color: color-mix(in oklch, var(--info) 45%, var(--border)); background: color-mix(in oklch, var(--info) 6%, transparent); }
  .live-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--info); animation: pulse 2s ease-out infinite; }
  .tl-step.held .live-dot { background: var(--warning); animation: none; }
  /* A crash: red, and pulsing while it is the newest thing that happened (or the coordinator is on it) */
  .tl-step.failed { border-color: color-mix(in oklch, var(--destructive) 45%, var(--border)); background: color-mix(in oklch, var(--destructive) 6%, transparent); }
  .live-dot.bad { background: var(--destructive); animation: none; }
  .live-dot.bad.now { animation: pulse-bad 1.6s ease-out infinite; }
  .tl-item.failed .tl-dot, .tl-item.repairing .tl-dot { border-color: var(--destructive); background: var(--destructive); animation: pulse-bad 1.6s ease-out infinite; }
  .stage.failed .stage-bar { animation: glow-bad 2s ease-in-out infinite; }
  .stage.repairing .stage-bar { background: repeating-linear-gradient(-45deg, color-mix(in oklch, var(--destructive) 75%, transparent) 0 5px, color-mix(in oklch, var(--destructive) 28%, transparent) 5px 10px); background-size: 14.142px 14.142px; animation: stripes 0.9s linear infinite, glow-bad 2s ease-in-out infinite; }
  .stage.repairing .stage-name { color: var(--destructive); font-weight: 600; }
  .logs-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .logs-bar input[type=text] { flex: 1; width: auto; min-width: 140px; }
  table.logs td { padding: 6px 8px; font-size: 13px; }
  table.logs td.time { white-space: nowrap; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  table.logs .where { font-size: 12px; color: var(--muted-foreground); }

  /* Motion: short, small, and only for real changes (a 5 s refresh that changed nothing moves nothing) */
  @keyframes fade-up { from { opacity: 0; transform: translateY(4px); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(12px); } }
  @keyframes bump { 40% { transform: scale(1.08); } }
  @keyframes stripes { to { background-position: 14.142px 0; } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--info) 50%, transparent); } 50% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--info) 85%, transparent), 0 0 12px 1px color-mix(in oklch, var(--info) 45%, transparent); } }
  @keyframes glow-warn { 0%, 100% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--warning) 45%, transparent); } 50% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--warning) 80%, transparent), 0 0 10px 1px color-mix(in oklch, var(--warning) 40%, transparent); } }
  @keyframes pulse-bad { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--destructive) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  @keyframes glow-bad { 0%, 100% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--destructive) 45%, transparent); } 50% { box-shadow: 0 0 0 1px color-mix(in oklch, var(--destructive) 85%, transparent), 0 0 12px 1px color-mix(in oklch, var(--destructive) 40%, transparent); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--info) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  .enter { animation: fade-up 0.22s ease-out both; }
  .view-in { animation: fade-up 0.2s ease-out; }
  .panel-in { animation: slide-in 0.24s ease-out; }
  .bump { display: inline-block; animation: bump 0.32s ease-out; }
  .chip { transition: color 0.2s, background-color 0.2s, border-color 0.2s; }
  details[open] > pre { animation: fade-up 0.18s ease-out; }
  nav#tabs button, .icon-btn { transition: background-color 0.15s, color 0.15s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .icon-btn { display: none; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px; border-right: 0; border-bottom: 1px solid var(--sidebar-border); }
    .sidebar-head { padding: 0 12px 0 0; }
    .brand { flex: none; }
    .nav-label { display: none; }
    nav#tabs { flex-direction: row; }
    .sidebar-foot { margin: 0 0 0 auto; }
    .page { padding: 16px; }
    .stats { grid-template-columns: minmax(0, 1fr); }
    main.open { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; max-height: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="brand-mark">SF</span><span class="brand-name">Software factory</span></div>
      <button class="icon-btn" id="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar (Ctrl/Cmd+B)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
    </div>

      el("span", { class: "fstat" }, el("span", { class: "a" }, `+${f.additions}`), " ", el("span", { class: "d" }, `−${f.deletions}`)));
  }));
  body.replaceChildren(...d.files.map((f, i) => {
    // Big files and files past the first 30 start closed, and are drawn only when opened.
    const big = f.additions + f.deletions > 600 || i >= 30;
    const closed = diffing.closed.has(f.path) || (big && !diffing.opened.has(f.path));
    const tbody = el("tbody");
    const box = el("section", { class: `dfile${closed ? " closed" : ""}`, id: `dfile-${i}` },
      el("div", { class: "dfile-head", onclick: () => {
        const nowClosed = box.classList.toggle("closed");
        if (nowClosed) { diffing.closed.add(f.path); diffing.opened.delete(f.path); } else { diffing.closed.delete(f.path); diffing.opened.add(f.path); }
        if (!nowClosed && !box.dataset.drawn) { tbody.replaceChildren(...fileRows(f)); box.dataset.drawn = "1"; }
      } },
        el("span", { class: "twist" }, "›"), el("span", { class: `fs ${status(f)}` }, status(f)),
        el("span", { class: "fpath" }, f.from ? `${f.from} → ${f.path}` : f.path),
        el("span", { class: "fstat" }, el("span", { class: "a" }, `+${f.additions}`), " ", el("span", { class: "d" }, `−${f.deletions}`))),
      el("div", { class: "dfile-body" },
        f.binary ? el("div", { class: "dfile-more" }, "A binary file: not shown.") : el("table", { class: "code" }, tbody),
        f.cut ? el("div", { class: "dfile-more" }, `${f.cut} more lines not shown.`) : null));
    if (!closed && !f.binary) { tbody.replaceChildren(...fileRows(f)); box.dataset.drawn = "1"; }
    return box;
  }));
  view.scrollTop = scroll;
}
async function loadDiff() {
  if (!diffing || !$("diff").open) return;
  const at = diffing;
  let data;
  try {
    data = await api(`/api/tickets/${encodeURIComponent(at.ticketId)}/steps/${encodeURIComponent(at.step)}/diff`);
  } catch (e) {
    $("diff-files").replaceChildren();
    $("diff-body").replaceChildren(el("div", { class: "dfile-more error" }, e.message));
    return;
  }
  if (diffing !== at) return;
  const sig = JSON.stringify(data);
  if (sig !== at.sig) { at.sig = sig; drawDiff(data); }
  clearTimeout(at.timer);
  if (data.live) at.timer = setTimeout(loadDiff, 3000); // live while the step runs
}
/** The code the agent is typing now, in the drawer: a write as its lines, an edit as a diff. */
function drawPending() {
  const box = $("diff-pending");
  const call = diffing?.tracker?.writing();
  if (!call) { box.replaceChildren(); return; }
  const a = call.args || {};
  const path = shownPath(a.path || a.file_path || "");
  const ext = extOf(path);
  const rows = [];
  if (call.name === "write") {
    const lines = String(a.content ?? "").split("\n");
    const from = Math.max(0, lines.length - 400); // the end, where the typing is
    if (from > 0) rows.push(el("tr", { class: "hunk" }, el("td", { colspan: 4 }, `… ${from} lines above`)));
    lines.slice(from).forEach((t, i) => rows.push(el("tr", { class: "add" }, el("td", { class: "ln" }, ""), el("td", { class: "ln" }, from + i + 1), el("td", { class: "sg" }, "+"), el("td", { class: "tx" }, ...highlight(t, ext)))));
  } else {
    for (const [k, e] of (Array.isArray(a.edits) ? a.edits : []).entries()) {
      if (!e) continue;
      rows.push(el("tr", { class: "hunk" }, el("td", { colspan: 4 }, `edit ${k + 1}`)));
      const dels = String(e.oldText ?? "").split("\n").map((t) => ({ kind: "del", text: t }));
      const adds = e.newText === undefined ? [] : String(e.newText).split("\n").map((t) => ({ kind: "add", text: t }));
      const marks = emphasis([...dels, ...adds]);
      for (const l of [...dels, ...adds]) rows.push(el("tr", { class: l.kind }, el("td", { class: "ln" }, ""), el("td", { class: "ln" }, ""), el("td", { class: "sg" }, l.kind === "add" ? "+" : "−"), el("td", { class: "tx" }, ...codeCells(l.text, ext, marks.get(l)))));
    }
  }
  box.replaceChildren(el("section", { class: "dfile pending" },
    el("div", { class: "dfile-head" }, inPhase(el("span", { class: "live-dot" }), 2000), el("span", {}, call.name === "write" ? "Writing now" : "Editing now"), el("span", { class: "fpath" }, path || "…")),
    el("div", { class: "dfile-body" }, el("table", { class: "code" }, el("tbody", {}, ...rows)))));
}
let pendingFrame = 0;
const schedulePending = () => { if (!pendingFrame) pendingFrame = setTimeout(() => { pendingFrame = 0; drawPending(); }, 100); };
/** Open the drawer on what `step` changed: live while it runs, with the code it is typing streamed. */
function openDiff(t, step) {
  if (diffing) { clearTimeout(diffing.timer); diffing.source?.close(); }
  diffing = { ticketId: t.id, step: step.name, sig: "", closed: new Set(), opened: new Set(), timer: 0, source: null, tracker: callTracker() };
  $("diff-title").textContent = `${t.cid} · ${step.name}`;
  $("diff-sub").replaceChildren(el("span", {}, "Loading the diff…"));
  $("diff-commits").replaceChildren();
  $("diff-files").replaceChildren();
  $("diff-pending").replaceChildren();
  $("diff-body").replaceChildren();
  if (!$("diff").open) $("diff").showModal();
  if (step.status === "running") {
    const at = diffing;
    const source = new EventSource(`/api/tickets/${encodeURIComponent(t.id)}/events?conversation=${step.conversationId}`);
    at.source = source;
    source.onmessage = (m) => {
      if (diffing !== at) return source.close();
      const e = JSON.parse(m.data);
      if (at.tracker.apply(e)) schedulePending();
      // The call ran: the file is on disk, so the diff below has it now.
      if (e.type === "tool_end" || e.type === "run_end") { at.tracker.calls.clear(); schedulePending(); clearTimeout(at.timer); loadDiff(); }
    };
  }
  loadDiff();
}
$("diff-close").addEventListener("click", () => $("diff").close());
$("diff").addEventListener("click", (e) => { if (e.target === $("diff")) $("diff").close(); });
$("diff").addEventListener("close", () => { if (diffing) { clearTimeout(diffing.timer); diffing.source?.close(); } diffing = null; });

// ---- model spend and limits ----
function drawUsage(u) {
  if (!u) return;
  const spent = u.today.total.cost, budget = u.limits.dailyBudgetUsd;
  $("spend").textContent = budget > 0 ? `${money(spent)} / ${money(budget)}` : money(spent);
  const share = budget > 0 ? Math.min(1, spent / budget) : 0;
  $("spend-fill").style.width = `${Math.round(share * 100)}%`;
  $("spend-fill").className = `meter-fill${share >= 1 ? " bad" : share >= 0.8 ? " warn" : ""}`;
  setStat("stat-spend", money(spent));
  $("stat-spend-sub").textContent = `${budget > 0 ? `of ${money(budget)} · ` : "no daily budget · "}${u.today.total.requests} requests`;
  const waits = u.waiting.filter((w) => !/ is paused /.test(w.reason));
  $("waiting").hidden = waits.length === 0;
  $("waiting").textContent = waits.length ? `${waits.length} request${waits.length > 1 ? "s" : ""} waiting: ${waits[0].reason}` : "";
  $("banner").hidden = !u.budgetReached;
  $("banner-text").textContent = u.budgetReached ? `Daily budget reached: ${money(spent)} of ${money(budget)} spent today. Running tickets are paused and continue when the budget is back (tomorrow, or raise DAILY_BUDGET_USD and restart).` : "";
}

// ---- refresh ----
// Never redraw under your cursor: a steer or an approval note you are typing stays.
const typing = () => document.activeElement && $("detail").contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
function applyOverview(data) {
  overview = data;
  PHASE_LABEL = Object.fromEntries((overview.phases || []).map((p) => [p.phase, p.label]));
  drawUsage(overview.usage);
  drawSentry(); drawRuns(); drawSprint();
  $("status").textContent = `${streamOk ? "live" : "updated"} ${new Date().toLocaleTimeString()}`;
}
/** Fetch everything now (after an action, or while the stream is down). */
async function refresh() {
  try {
    applyOverview(await api("/api/overview"));
    if (openId && !typing()) await drawDetail(false);
  } catch (e) { flash(e.message, true); }
}
// The state stream: the server pushes the overview, and the open ticket, the moment they change.
// While it is down (a restart), the browser polls every 5 s; EventSource reconnects by itself.
let stream = null, streamFor = null, streamOk = false;
function connect() {
  const want = openId || "";
  if (stream && streamFor === want) return;
  stream?.close();
  streamFor = want;
  stream = new EventSource(`/api/stream${want ? `?ticket=${encodeURIComponent(want)}` : ""}`);
  stream.addEventListener("overview", (m) => { streamOk = true; applyOverview(JSON.parse(m.data)); });
  stream.addEventListener("ticket", (m) => {
    const data = JSON.parse(m.data);
    if (data.ticket && data.ticket.id === openId && !typing()) drawDetail(false, data);
  });
  stream.onerror = () => { streamOk = false; };
}
refresh();
connect();
loadSprint(false);
setInterval(() => { if (!streamOk) refresh(); }, 5000);
setInterval(() => tab === "sprint" && loadSprint(false), 60000);
</script>
